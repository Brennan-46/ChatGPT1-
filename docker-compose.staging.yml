version: '3.9'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql+psycopg://agent:agent@postgres:5432/agent
      - API_KEY=${API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - '5432:5432'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
