<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating AI Chat Widget</title>
  <style>
    :root {
      /* Palette derived from [Company Website URL] - replace with exact brand colors */
      --brand-primary: #0b3b66;
      --brand-secondary: #16a6b6;
      --brand-accent: #f59e0b;
      --surface: #ffffff;
      --surface-soft: #f4f8fb;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe4ef;
      --success: #10b981;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f8fafc, #eef5fa);
      min-height: 100vh;
    }

    .widget-toggle {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(11, 59, 102, 0.35);
      z-index: 999;
    }

    .widget {
      position: fixed;
      right: 20px;
      bottom: 90px;
      width: min(360px, calc(100vw - 24px));
      height: 500px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
      display: none;
      overflow: hidden;
      z-index: 998;
    }

    .widget.open { display: flex; flex-direction: column; }

    .widget-header {
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .widget-header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .widget-header small { opacity: 0.9; font-size: 12px; }

    .close-btn {
      border: none;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 15px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      background: var(--surface-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--brand-primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .typing {
      font-size: 12px;
      color: var(--muted);
      margin-top: -4px;
    }

    .cta-wrap {
      padding: 0 14px 12px;
      background: var(--surface-soft);
      display: none;
    }

    .cta-wrap.show { display: block; }

    .book-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--success), #0ea5a2);
      cursor: pointer;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--brand-secondary);
      box-shadow: 0 0 0 3px rgba(22, 166, 182, 0.16);
    }

    .send-btn {
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--brand-accent);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="widget-toggle" id="toggleBtn" aria-label="Open chat">💬</button>

  <section class="widget" id="chatWidget" aria-live="polite" aria-label="Floating AI Chat Widget">
    <header class="widget-header">
      <div>
        <h1>[Company Name] AI Assistant</h1>
        <small>Ask us anything about [Industry]</small>
      </div>
      <button class="close-btn" id="closeBtn" aria-label="Close chat">✕</button>
    </header>

    <div class="messages" id="messages"></div>
    <div class="cta-wrap" id="ctaWrap">
      <button class="book-btn" id="bookBtn">Book Now</button>
    </div>

    <form class="chat-form" id="chatForm">
      <input class="chat-input" id="chatInput" type="text" placeholder="Type your question..." autocomplete="off" required />
      <button class="send-btn" type="submit">Send</button>
    </form>
  </section>

  <script>
    const BOOKING_URL = '[Company\'s Booking Page]';
    const CITY = '[City]';

    const mockResponses = [
      `Yes, we have a technician available for ${CITY} tomorrow at 10:00 AM.`,
      'Our [Industry] consultation includes a full assessment, clear pricing, and same-day follow-up options.',
      'Absolutely — we can share a personalized quote in minutes once you confirm your service location and preferred time.'
    ];

    const toggleBtn = document.getElementById('toggleBtn');
    const closeBtn = document.getElementById('closeBtn');
    const chatWidget = document.getElementById('chatWidget');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const messages = document.getElementById('messages');
    const ctaWrap = document.getElementById('ctaWrap');
    const bookBtn = document.getElementById('bookBtn');

    let userMessageCount = 0;
    let responseIndex = 0;

    function addMessage(text, sender = 'bot') {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function addTypingIndicator() {
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.id = 'typingIndicator';
      typing.textContent = 'AI is typing...';
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function getNextResponse() {
      const response = mockResponses[responseIndex % mockResponses.length];
      responseIndex += 1;
      return response;
    }

    function showBookNowIfNeeded() {
      if (userMessageCount >= 2) {
        ctaWrap.classList.add('show');
      }
    }

    function openWidget() {
      chatWidget.classList.add('open');
      chatInput.focus();
      if (!messages.children.length) {
        addMessage('Hi! I\'m your AI assistant. Ask me anything about [Industry].');
      }
    }

    toggleBtn.addEventListener('click', openWidget);
    closeBtn.addEventListener('click', () => chatWidget.classList.remove('open'));

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      chatInput.value = '';
      userMessageCount += 1;

      addTypingIndicator();
      setTimeout(() => {
        removeTypingIndicator();
        addMessage(getNextResponse(), 'bot');
        showBookNowIfNeeded();
      }, 500);
    });

    bookBtn.addEventListener('click', () => {
      if (BOOKING_URL.startsWith('http')) {
        window.location.href = BOOKING_URL;
      } else {
        alert('Please replace [Company\'s Booking Page] with a valid URL.');
      }
    });
  </script>
</body>
</html>
